[package]
name = "agenticpay-guardrails"
version = "0.1.0"
description = "On-chain spend caps, per-transaction limits, and session-key guardrails for AgenticPay"
edition = "2021"

[lib]
name = "agenticpay_guardrails"
crate-type = ["cdylib", "lib"]

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
blake3 = "=1.5.5"

[profile.release]
overflow-checks = true